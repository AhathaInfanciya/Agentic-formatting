name: Python Code Quality Agent

permissions:
  contents: write
  pull-requests: write

on:
  push:
    branches:
      - main
      - feature/**

jobs:
  quality-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python agentic_ai.py

      - name: Remove Generated Artifacts
        run: |
          rm -rf __pycache__
          rm -f .coverage
          rm -f coverage.json
          rm -f quality_report.md
          rm -f pytest_failure.log
       



      - name: Commit Generated Changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git add *.py || true

          if git diff --staged --quiet; then
            echo "No meaningful changes detected"
          else
            git commit -m "Agent generated test updates"
          fi


          

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: agent-generated-updates
          base: main
          title: Agent Generated Updates
          body: |
            Automated updates generated by the Python Code Quality Agent.

            Includes:
            - Generated tests
            - Coverage improvements
            - Formatting fixes
            - Quality report updates
          commit-message: Agent generated updates

      - name: Upload Quality Report
        uses: actions/upload-artifact@v4
        with:
          name: quality-report
          path: quality_report.md
